[package]
name = "sbcli"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
singbox-clash-api = { git = "https://github.com/nlkli/singbox-clash-api.git" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] } 
serde_json = "1" 
base64 = "0.23"
url = "2.5"
percent-encoding = "2"
thiserror = "2"
uuid = { version = "1", features = ["v5", "v4"] }
fastrand = "2.5"
crossterm = { version = "0.29", default-features = false, features = ["events", "use-dev-tty"] }
unicode-width = "0.2.3"
