[package]
name = "singbox-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
singbox-clash-api = { git = "https://github.com/nlkli/singbox-clash-api.git" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] } 
serde_json = "1" 
base64 = "0.23"
url = "2.5"
percent-encoding = "2"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }
